name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  content-branch:
    name: Content branch guard
    if: startsWith(github.head_ref || github.ref_name, 'codex/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Codex branches change content only and start from current main
        run: |
          git fetch --no-tags origin main
          node scripts/guard-content-branch.mjs origin/main

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Fast critical-flow gate
        run: pnpm check:fast

      - name: Production-blocking release gate
        run: pnpm check:release
